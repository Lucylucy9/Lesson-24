<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <a href="/" class="logo">Study <span>Flow</span></a>
      <nav class="nav">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Courses</a>
        <a href="#">Schedules</a>
        <a href="#">Messages</a>
      </nav>

      <!-- right -->
      <div class="header-action">
        <button class="notification">
          <span>🔔</span>
          <span class="notification-dot"></span>
        </button>
        <div class="profile">
          <div class="avatar">LB</div>
          <div>
            <strong>Lucy Bekauri</strong>
            <span>Front-End Student</span>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="page-title">
        <h1>Student Dashboard</h1>
        <p>Track your courses, lessons and weekly activity.</p>
      </section>

      <section class="stats-grid">
        <!-- Card 1 START -->
        <article class="card stat-card">
          <div class="stat-icon purple">📚</div>

          <div>
            <span>Active Courses</span>
            <strong>6</strong>
          </div>

          <span class="trend positive">+2 this month</span>
        </article>
        <!-- Card 1 End -->

        <!-- Card 2 START -->
        <article class="card stat-card">
          <div class="stat-icon blue">📚</div>

          <div>
            <span>Hours learned</span>
            <strong>42.5</strong>
          </div>

          <span class="trend positive">+8.4%</span>
        </article>
        <!-- Card 2 End -->

         <!-- Card 3 START -->
        <article class="card stat-card">
          <div class="stat-icon orange">📚</div>

          <div>
            <span>Hours learned</span>
            <strong>42.5</strong>
          </div>

          <span class="trend">+8.4%</span>
        </article>
        <!-- Card 3 End -->

         <!-- Card 4 START -->
        <article class="card stat-card">
          <div class="stat-icon green">📚</div>

          <div>
            <span>Hours learned</span>
            <strong>42.5</strong>
          </div>

          <span class="trend positive">+8.4%</span>
        </article>
        <!-- Card 4 End -->

      </section>
    </main>

    <button class="support-button">?</button>
  </body>
</html>
